<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Tomás Ángel Torres — Digital Transformation, AI Solutions &amp; IT Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2137"/>
      <stop offset="0.55" stop-color="#163554"/>
      <stop offset="1" stop-color="#1e4976"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="270" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accent)"/>

  <!-- Olas sutiles de fondo -->
  <path d="M0 212 q125 -30 250 0 t250 0 t250 0 t250 0" fill="none" stroke="#28527a" stroke-width="2.5" opacity="0.55"/>
  <path d="M0 236 q125 -30 250 0 t250 0 t250 0 t250 0" fill="none" stroke="#224669" stroke-width="2.5" opacity="0.5"/>
  <path d="M0 258 q125 -30 250 0 t250 0 t250 0 t250 0" fill="none" stroke="#1b3a57" stroke-width="2.5" opacity="0.45"/>

  <!-- Insignia / Nodos + Ancla -->
  <g transform="translate(52,72)">
    <rect width="98" height="98" rx="20" fill="#091829" stroke="#356899" stroke-width="1.5"/>
    <g fill="none" stroke="#5aa9e6" stroke-width="3.5" stroke-linecap="round">
      <path d="M16 68 q11 -8 22 0 t22 0 t22 0"/>
      <path d="M16 80 q11 -8 22 0 t22 0 t22 0" stroke="#9ecbf0" opacity="0.85"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="49" cy="25" r="5" stroke="#d4af37"/>
      <line x1="49" y1="30" x2="49" y2="57"/>
      <line x1="36" y1="37" x2="62" y2="37"/>
      <path d="M31 49 q0 14 18 14 q18 0 18 -14"/>
    </g>
  </g>

  <!-- Encabezado superior derecha -->
  <text x="948" y="42" fill="#8bb8e0" font-size="11.5" font-weight="600" text-anchor="end" letter-spacing="2.5">ARQUITECTURA · AGENTES IA · AUTOMATIZACIÓN · CLOUD IT</text>

  <!-- Nombre y rol -->
  <text x="176" y="100" fill="#ffffff" font-size="40" font-weight="800">Tomás Ángel Torres</text>
  <text x="178" y="132" fill="#a8d1f5" font-size="16.5" font-weight="600" letter-spacing="0.4">Digital Transformation &amp; IT Lead · AI Solutions Builder · Finanzas + Sistemas</text>

  <!-- Fila 1 de chips: Ingeniería & Datos -->
  <g font-size="12.5" font-weight="600" fill="#eaf3fc">
    <rect x="178" y="152" width="92" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.13"/>
    <text x="224" y="169" text-anchor="middle">C# · .NET 10</text>

    <rect x="278" y="152" width="68" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.13"/>
    <text x="312" y="169" text-anchor="middle">Blazor</text>

    <rect x="354" y="152" width="72" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.13"/>
    <text x="390" y="169" text-anchor="middle">Python</text>

    <rect x="434" y="152" width="96" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.13"/>
    <text x="482" y="169" text-anchor="middle">PostgreSQL</text>

    <rect x="538" y="152" width="72" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.13"/>
    <text x="574" y="169" text-anchor="middle">Docker</text>

    <rect x="618" y="152" width="84" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.13"/>
    <text x="660" y="169" text-anchor="middle">Power BI</text>
  </g>

  <!-- Fila 2 de chips: IA & Cloud Microsoft -->
  <g font-size="12.5" font-weight="600" fill="#fff7dc">
    <rect x="178" y="185" width="128" height="25" rx="12.5" fill="#d4af37" fill-opacity="0.22" stroke="#d4af37" stroke-opacity="0.45"/>
    <text x="242" y="202" text-anchor="middle">Claude Code · n8n</text>

    <rect x="314" y="185" width="144" height="25" rx="12.5" fill="#d4af37" fill-opacity="0.22" stroke="#d4af37" stroke-opacity="0.45"/>
    <text x="386" y="202" text-anchor="middle">Antigravity · Gemini</text>

    <rect x="466" y="185" width="152" height="25" rx="12.5" fill="#5aa9e6" fill-opacity="0.22" stroke="#5aa9e6" stroke-opacity="0.45" fill-rule="nonzero"/>
    <text x="542" y="202" fill="#eaf3fc" text-anchor="middle">Azure AI · Copilot Studio</text>

    <rect x="626" y="185" width="166" height="25" rx="12.5" fill="#5aa9e6" fill-opacity="0.22" stroke="#5aa9e6" stroke-opacity="0.45"/>
    <text x="709" y="202" fill="#eaf3fc" text-anchor="middle">M365 Premium · Intune</text>
  </g>
</svg>
